<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="p-4">
                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <p-floatlabel variant="on">
                            <input pInputText id="loginEmail" [(ngModel)]="email" name="email" type="email"
                                autocomplete="off" />
                            <label for="loginEmail">Email</label>
                        </p-floatlabel>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <p-floatlabel variant="on">
                            <input pInputText id="password" [(ngModel)]="password" name="password" type="password"
                                autocomplete="off" />
                            <label for="password">Password</label>
                        </p-floatlabel>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <a class="text-decoration-none" (click)="onForgotPassword()">
                            Forgot Password?
                        </a>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <button pButton type="submit" class="btn btn-primary w-100">
                            Sign In
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
