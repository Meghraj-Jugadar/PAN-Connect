<div class="auth-wrapper">
  <div class="auth-card">

    <!-- LEFT PANEL -->
    <div class="col-md-6 auth-left d-none d-md-flex">
      <div class="overlay-text">
        <p>WELCOME BACK TO</p>
        <h2>PANCONNECT</h2>
      </div>
      <img src="assets/login-illustration.png" alt="Login Illustration" class="auth-image" />
    </div>

    <!-- RIGHT PANEL -->
    <div class="col-12 col-md-6 auth-right">
      <span class="auth-right-header-span">
        <p class="auth-right-header">Welcome back</p>
        <p class="auth-right-subheader">Sign in to your account</p>
      </span>

      <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="auth-form">

        <!-- EMAIL -->
        <div class="form-input">
          <p-floatlabel variant="on">
            <input pInputText id="email" [(ngModel)]="email" name="email" type="email" autocomplete="off" />
            <label for="email">Email</label>
          </p-floatlabel>
        </div>

        <!-- PASSWORD -->
        <div class="form-input">
          <p-floatlabel variant="on" class="password-field">
            <input pInputText id="password" [(ngModel)]="password" name="password"
              [type]="showPassword ? 'text' : 'password'" />
            <label for="password">Password</label>

            <!-- Eye Icon -->
            <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash eye-green' : 'pi-eye eye-red'"
              (click)="showPassword = !showPassword"></i>
          </p-floatlabel>
        </div>

        <!-- FORGOT PASSWORD LINK -->
        <div class="forgot-password-link">
          <a (click)="onForgotPassword()">Forgot Password?</a>
        </div>

        <!-- BUTTON -->
        <div class="form-actions">
          <button pButton type="submit" class="register-btn btn-primary">
            Sign In
          </button>
        </div>

        <div class="signin-text">
          Don't have an account?
          <span (click)="onSignUp()">Sign up</span>
        </div>

      </form>
    </div>

  </div>
</div>
