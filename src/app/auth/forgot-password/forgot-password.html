<div class="auth-wrapper">
    <div class="auth-card">
        <div class="col-12 col-md-8 col-lg-6 forgate-password-card">
            <span class="forgot-password-header-span">
                <p class="forgot-password-header">Reset your password</p>
                <p class="forgot-password-subheader">Enter your email address and we'll send you a link to reset your
                    password.</p>
            </span>
            <form #forgotPassForm="ngForm" (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!isEmailSent">
                <div class="form-input">
                    <p-floatlabel variant="on">
                        <input pInputText id="email" [(ngModel)]="email" name="email" type="email" autocomplete="off" />
                        <label for="email">Email</label>
                    </p-floatlabel>
                </div>

                <div class="col-12 mb-3 reset-password-btn">
                    <button pButton type="submit" class="btn btn-primary w-100">
                        Reset Password
                    </button>
                </div>

                <div class="col-12 back-to-login-link">
                    <span class="login-text" (click)="onBackToLogin()">
                        Back to Login
                    </span>
                </div>

                <div class="col-12 signin-text-div">
                    Don't have an account?
                    <span class="signin-text" (click)="onSignUp()">
                        Sign up
                    </span>
                </div>
            </form>

        </div>
    </div>
</div>
