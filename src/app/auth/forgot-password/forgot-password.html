<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <form #forgotPassForm="ngForm" (ngSubmit)="onSubmit()" class="p-4" *ngIf="!isEmailSent">
                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <p-floatlabel variant="on">
                            <input pInputText id="forgotEmail" [(ngModel)]="email" name="email" type="email"
                                autocomplete="off" />
                            <label for="forgotEmail">Email</label>
                        </p-floatlabel>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 mb-3">
                        <button pButton type="submit" class="btn btn-primary w-100">
                            Reset Password
                        </button>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <a class="text-decoration-none" (click)="onBackToLogin()">
                            Back to Login
                        </a>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
