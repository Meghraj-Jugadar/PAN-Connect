<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <form (ngSubmit)="onSubmit()" class="p-4">
        <div class="row">
          <div class="col-12 mb-3">
            <p-floatlabel variant="on">
              <input pInputText id="password" [(ngModel)]="password" name="password" type="password" autocomplete="off" />
              <label for="password">New Password</label>
            </p-floatlabel>
          </div>
        </div>

        <div class="row">
          <div class="col-12 mb-3">
            <p-floatlabel variant="on">
              <input pInputText id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" type="password" autocomplete="off" />
              <label for="confirmPassword">Confirm Password</label>
            </p-floatlabel>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <button pButton type="submit" class="btn btn-primary w-100">
              Reset Password
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
