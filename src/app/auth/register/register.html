<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <form (ngSubmit)="onSubmit()" class="p-4">
        <div class="row">
          <div class="col-12 col-md-6 mb-3">
            <p-floatlabel variant="on">
                <input pInputText id="firstName" [(ngModel)]="fName" name="fName" autocomplete="off" />
                <label for="firstName">First Name</label>
            </p-floatlabel>
          </div>
          
          <div class="col-12 col-md-6 mb-3">
            <p-floatlabel variant="on">
                <input pInputText id="email" [(ngModel)]="email" name="email" type="email" autocomplete="off" />
                <label for="email">Email</label>
            </p-floatlabel>
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-md-6 mb-3">
            <p-floatlabel variant="on">
                <input pInputText id="password" [(ngModel)]="password" name="password" type="password" autocomplete="off" />
                <label for="password">Password</label>
            </p-floatlabel>
          </div>
          
          <div class="col-12 col-md-6 mb-3">
            <p-floatlabel variant="on">
                <input pInputText id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" type="password" autocomplete="off" />
                <label for="confirmPassword">Confirm Password</label>
            </p-floatlabel>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <button 
              pButton 
              type="submit" 
              class="btn btn-primary w-100">
              Register
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
